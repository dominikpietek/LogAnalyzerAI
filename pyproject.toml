[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stackscout"
version = "0.2.0"
description = "Lokalny agent AI analizujący logi .NET i proponujący poprawki w kodzie"
readme = "README.md"
requires-python = ">=3.10.11"
dependencies = [
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B017", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[project.scripts]
stackscout-api = "stackscout.api.server:run"
